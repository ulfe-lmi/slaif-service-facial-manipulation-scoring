[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slaif-facial-manipulation-scoring"
version = "0.1.0"
description = "SLAIF service wrapper and evaluation suite for SelfMAD++"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "SLAIF" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2",
  "opencv-python-headless==4.10.0.84",
  "pillow>=10,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.5,<1"]
evaluation = ["matplotlib>=3.8,<4"]

[project.scripts]
slaif-fms = "slaif_fms.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slaif_fms = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
